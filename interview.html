    a{color:#1f5fbf;font-weight:700;white-space:nowrap}a:focus-visible{outline:2px solid #1f5fbf;outline-offset:4px}
    .toc{width:min(900px,calc(100% - 48px));margin:0 auto 24px;border:1px solid #d4dfed;border-radius:10px;background:#fff}

    .toc-groups{padding:0 20px 20px;border-top:1px solid #e6edf5}.toc h2{margin:22px 0 10px;font-size:17px}

    .toc li{padding-left:4px;line-height:1.5}.toc li a{color:#243449;font-weight:400;white-space:normal;text-decoration:none}
    .toc li a:hover,.toc li a:focus-visible{color:#1f5fbf;text-decoration:underline}
    main{width:min(900px,100%);margin:0 auto;padding:0 24px 48px}figure{position:relative;aspect-ratio:612/792;margin:0 0 16px;background:white;box-shadow:0 3px 18px rgba(20,45,75,.08)}
    figure img{display:block;width:100%;height:auto}
    .question-anchor{position:absolute;left:0;width:1px;height:1px;scroll-margin-top:12px}
    @media(max-width:600px){header{display:block;padding:24px 18px 18px}header a{display:inline-block;margin-top:12px}.toc{width:calc(100% - 16px);margin-bottom:16px}.toc ol{grid-template-columns:1fr}main{padding:0 8px 28px}figure{margin-bottom:8px}}
  </style>
</head>

    ];
    const groups = document.querySelector('#toc-groups');
    for (const [start, end, title] of sections) {
      const heading = document.createElement('h2');
      heading.textContent = title;
      const list = document.createElement('ol');
      list.start = start;
      for (let number = start; number <= end; number++) {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = `#q-${number}`;
        link.textContent = questions[number - 1][2];
        item.append(link);
        list.append(item);
      }
      groups.append(heading, list);
    }
    const pages = document.querySelector('#pages');
    for (let number = 1; number <= 45; number++) {
      const figure = document.createElement('figure');
      const image = document.createElement('img');
      image.src = `./interview-pages/page-${String(number).padStart(2, '0')}.jpg`;
      image.alt = `面试100问第${number}页`;
      image.loading = number <= 2 ? 'eager' : 'lazy';
      image.decoding = 'async';
      figure.append(image);
      questions.forEach(([page, position], index) => {
        if (page !== number) return;
        const anchor = document.createElement('span');
        anchor.id = `q-${index + 1}`;
        anchor.className = 'question-anchor';
        anchor.style.top = `${position}%`;
        figure.append(anchor);
      });

</body>
</html>
