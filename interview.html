<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>面试｜电气学院就业日历</title>
  <style>
    :root{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;color:#17202c;background:#f8fafc}
    *{box-sizing:border-box}body{margin:0}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;width:min(1100px,100%);margin:0 auto;padding:32px 24px 24px}
    .eyebrow{margin:0 0 8px;color:#1f5fbf;font-size:14px;font-weight:700;letter-spacing:.08em}h1{margin:0;font-size:clamp(28px,4vw,40px)}
    a{color:#1f5fbf;font-weight:700;white-space:nowrap}a:focus-visible{outline:2px solid #1f5fbf;outline-offset:4px}
    main{width:min(900px,100%);margin:0 auto;padding:0 24px 48px}figure{margin:0 0 16px;background:white;box-shadow:0 3px 18px rgba(20,45,75,.08)}
    figure img{display:block;width:100%;height:auto}
    @media(max-width:600px){header{display:block;padding:24px 18px 18px}header a{display:inline-block;margin-top:12px}main{padding:0 8px 28px}figure{margin-bottom:8px}}
  </style>
</head>
<body>
  <header>
    <div><p class="eyebrow">面试资料</p><h1>面试100问（完整版）</h1></div>
    <a href="./interview-100-questions.pdf" target="_blank" rel="noopener noreferrer">打开或下载 PDF ↗</a>
  </header>
  <main id="pages" aria-label="面试100问全文"></main>
  <noscript><p>请启用 JavaScript 阅读页面，或使用上方链接打开 PDF。</p></noscript>
  <script>
    const pages = document.querySelector('#pages');
    for (let number = 1; number <= 45; number++) {
      const figure = document.createElement('figure');
      const image = document.createElement('img');
      image.src = `./interview-pages/page-${String(number).padStart(2, '0')}.jpg`;
      image.alt = `面试100问第${number}页`;
      image.loading = number <= 2 ? 'eager' : 'lazy';
      image.decoding = 'async';
      figure.append(image);
      pages.append(figure);
    }
  </script>
</body>
</html>
